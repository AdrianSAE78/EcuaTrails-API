spring.application.name=EcuaTrailsAPI
server.port=8080

#Postgres Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Ecuatrails
spring.datasource.username=postgres
spring.datasource.password=admin

#JPA Configuration
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.websocket.message-size-limit=64KB
spring.websocket.send-timeout=10s
spring.websocket.snd-buf-size=524288
spring.websocket.recv-buf-size=524288

jwt.secret-base64=${JWT_SECRET_BASE64}
