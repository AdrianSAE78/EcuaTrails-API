spring.application.name=EcuaTrailsAPI
server.port=8080

#Postgres Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/defaultdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:defaultuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:defaultpass}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

#JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.websocket.message-size-limit=64KB
spring.websocket.send-timeout=10s
spring.websocket.snd-buf-size=524288
spring.websocket.recv-buf-size=524288

jwt.secret-base64=${JWT_SECRET_BASE64}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

